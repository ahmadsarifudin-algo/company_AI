# LiteLLM Proxy Configuration
# Multi-Agentic AI Enterprise OS — 4-Tier Model Strategy
# Configured for OpenAI-only (no Anthropic/DeepSeek keys)

model_list:
  # ── Tier 1: Nano (9 agents) ────────────────
  - model_name: nano
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      tier: 1
      description: "Intent parsing, routing, classification, simple Q&A"
      max_tokens: 16384

  # ── Tier 2: Standard (33 agents) ──────────
  - model_name: standard
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      tier: 2
      description: "Reports, analysis, content writing, structured output"
      max_tokens: 8192

  - model_name: standard
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      tier: 2
      description: "Fallback for standard tier"
      max_tokens: 16384

  # ── Tier 3: Advanced (15 agents) ──────────
  - model_name: advanced
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      tier: 3
      description: "Orchestration, strategy, legal reasoning, architecture"
      max_tokens: 4096

  - model_name: advanced
    litellm_params:
      model: openai/o3-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      tier: 3
      description: "Reasoning-heavy tasks"
      max_tokens: 4096

  # ── Tier 4: Code Specialist ───────────────
  - model_name: code
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      tier: 4
      description: "Code generation and review"
      max_tokens: 16384

  # ── Tier 4: Vision Specialist ─────────────
  - model_name: vision
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      tier: 4
      description: "Image analysis and multimodal tasks"
      max_tokens: 4096

  # ── Embedding Model ───────────────────────
  - model_name: embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "RAG knowledge base, semantic search"

# ── Router Settings ─────────────────────────
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  fallbacks:
    - advanced: [standard]
    - standard: [nano]

# ── General Settings ────────────────────────
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
